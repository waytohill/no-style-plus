name: Link Check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --max-cache-age 7d
            --no-progress
            --max-retries 2
            --exclude-path _site
            --exclude-path vendor
            --exclude-path .jekyll-cache
            './**/*.md'
          fail: false
